                  - generic [ref=f14e381]:
                    - heading "High Level Design" [level=2] [ref=f14e382]
                    - generic [ref=f14e383]:
                      - generic [ref=f14e384]:
                        - heading "1. URL Shortening" [level=3] [ref=f14e385]
                        - paragraph [ref=f14e386]: Users should be able to input a long URL and receive a unique, shortened alias. The shortened URL should use a compact format with English letters and digits to save space and ensure uniqueness.
                        - paragraph [ref=f14e387]: "The design for URL shortening follows a basic two-tier architecture that processes requests quickly and scales to handle high volumes:"
                        - paragraph [ref=f14e388]:
                          - strong [ref=f14e389]: "1. Client:"
                          - text: The frontend application sends HTTP POST requests containing long URLs to the URL Shortening service.
                        - paragraph [ref=f14e390]:
                          - strong [ref=f14e391]: "2. URL Shortening Service:"
                          - text: "The backend receives requests and is responsible for creating and returning shortened URLs. It performs these key functions:"
                        - list [ref=f14e392]:
                          - listitem [ref=f14e393]: Generates a unique, short alias by encoding the URL or using hashing techniques to ensure uniqueness.
                          - listitem [ref=f14e394]: Stores the mapping of long URLs to short aliases in the database.
                          - listitem [ref=f14e395]: Manages errors and ensures each short URL is unique across all users.
                        - paragraph [ref=f14e396]:
                          - strong [ref=f14e397]: "3. Database:"
                          - text: A highly available database (e.g., DynamoDB or Cassandra) is used to persist mappings between long URLs and short aliases.
                        - paragraph [ref=f14e398]:
                          - img "URL Shortener Design Diagram 0 Shortening Flow" [ref=f14e400]
                        - paragraph [ref=f14e402]: This design supports efficient and quick URL shortening with minimal data storage requirements per URL entry.
                      - generic [ref=f14e403]: Got a question? Discuss this section with AI tutor
                    - generic [ref=f14e404]:
                      - generic [ref=f14e405]:
                        - heading "2. URL Redirection" [level=3] [ref=f14e406]
                        - paragraph [ref=f14e407]: When users access a shortened URL, the service should redirect them seamlessly to the original URL with minimal delay.
                        - paragraph [ref=f14e408]: The URL redirection service ensures that users accessing a shortened URL are quickly redirected to the original URL with minimal delay. This design focuses on high read throughput and low latency, as the read traffic will be significantly higher than URL creation.
                        - paragraph [ref=f14e409]:
                          - strong [ref=f14e410]: 1. API Gateway
                          - text: ": As we now have two request types, we need an API Gateway. This acts as the entry point for all incoming requests, routing POST requests to the URL Shortening Service and GET requests to the URL Redirection Handler."
                        - paragraph [ref=f14e411]:
                          - strong [ref=f14e412]: 2. URL Redirection Request Handler
                          - text: ": Accepts GET requests with the shortened URL, queries the cache for the original URL, and responds with a"
                          - code [ref=f14e413]: 302 Found
                          - text: status and the original URL in the
                          - code [ref=f14e414]: Location
                          - text: header to facilitate seamless redirection.
                        - paragraph [ref=f14e415]:
                          - strong [ref=f14e416]: 3. Caching Layer
                          - text: ": To reduce latency and offload read requests from the database, we implement a read-through caching layer (e.g., Redis with cache libraries) that stores frequently accessed URL mappings in memory. When a URL is not found in the cache, the cache itself automatically retrieves it from the database and stores it for future requests, making the process transparent to the Request Handler."
                        - paragraph [ref=f14e417]:
                          - strong [ref=f14e418]: 4. Database
                          - text: ": The database stores all URL mappings. The cache layer automatically queries the database when needed, without requiring the Request Handler to manage cache misses directly."
                        - paragraph [ref=f14e419]:
                          - img "URL Shortener Design Diagram 1 Redirection Flow" [ref=f14e421]
                        - paragraph [ref=f14e423]: This setup ensures efficient and reliable URL redirection at scale by combining the API Gateway, Request Handler, Caching Layer, and Database.
                      - generic [ref=f14e424]: Got a question? Discuss this section with AI tutor
                    - generic [ref=f14e425]:
                      - generic [ref=f14e426]:
                        - heading "3. Link Analytics" [level=3] [ref=f14e427]
                        - paragraph [ref=f14e428]: The system should be able to track the number of times each shortened URL is accessed to provide insights into link usage.
                        - paragraph [ref=f14e429]: To track the number of accesses for each shortened URL, we introduce an Analytics Service that counts and stores access events in real time. This setup provides useful insights into link usage patterns and is designed to scale for high traffic.
                        - paragraph [ref=f14e430]:
                          - strong [ref=f14e431]: 1. API Gateway
                          - text: ":"
                          - strong [ref=f14e432]: Routes GET requests to both
                          - text: the URL Redirection Handler (for redirection) and the Analytics Service (for tracking access).
                        - paragraph [ref=f14e433]:
                          - strong [ref=f14e434]: 2. Analytics Service
                          - text: ": Tracks each URL access by incrementing a counter associated with the short URL. This service logs access events and can be optimized by using a lightweight in-memory counter before periodically updating the database."
                        - paragraph [ref=f14e435]:
                          - strong [ref=f14e436]: 3. In-Memory Database
                          - text: ": For high-speed access counting, we use an in-memory data store like Redis to cache the counters for each short URL. This enables real-time tracking and reduces the load on the main database."
                        - paragraph [ref=f14e437]:
                          - strong [ref=f14e438]: 4. Database
                          - text: ": Periodically, the Analytics Service flushes the in-memory counters to the main database to ensure persistent storage of access counts."
                        - paragraph [ref=f14e439]:
                          - img "URL Shortener Design Diagram 2 Link Analytics Flow" [ref=f14e441]
                        - paragraph [ref=f14e443]: This architecture enables efficient, real-time analytics collection, combining the speed of in-memory storage with the durability of a database.
