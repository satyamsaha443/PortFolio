                    - paragraph [ref=f14e303]: Each adjective becomes a non-functional requirement that constrains our design choices.
                    - list [ref=f14e304]:
                      - listitem [ref=f14e305]:
                        - strong [ref=f14e306]: "High Availability:"
                        - text: The service should ensure that all URLs are accessible 24/7, with minimal downtime, so users can reliably reach their destinations. (Derived from 'high traffic')
