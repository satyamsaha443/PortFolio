                        - generic [ref=f14e508]: Mid-Level
                      - paragraph [ref=f14e510]:
                        - text: After generating a unique integer ID for each URL, we need to encode it into a shorter, readable string to create a user-friendly shortened URL. The encoding method must balance
                        - strong [ref=f14e511]: shortness
                        - text: with
