                - generic [ref=f14e234]:
                  - generic [ref=f14e235]:
                    - heading "Introduction" [level=2] [ref=f14e236]
                    - paragraph [ref=f14e237]:
                      - text: A URL Shortener is a service that takes a long URL and generates a shorter, unique alias that redirects users to the original URL. Popular examples include
                      - link "bit.ly" [ref=f14e238] [cursor=pointer]:
                        - /url: https://bitly.com
                      - text: ","
                      - link "TinyURL" [ref=f14e239] [cursor=pointer]:
                        - /url: https://tinyurl.com
                      - text: ", and Twitter's t.co."
                    - paragraph [ref=f14e240]:
                      - img "URL Shortening Concept" [ref=f14e242]
                    - paragraph [ref=f14e244]: This alias is often a fixed-length string of characters. The system should be able to handle millions of URLs, allowing users to create, store, and retrieve shortened URLs efficiently. Each shortened URL needs to be unique and persistent. Additionally, the service should be able to handle high traffic, with shortened URLs redirecting to the original links in near real-time. In some cases, the service may include analytics to track link usage, such as click counts and user locations.
                  - generic [ref=f14e245]:
                    - heading "Functional Requirements" [level=2] [ref=f14e246]
                    - paragraph [ref=f14e247]:
                      - text: We
                      - link "extract verbs" [ref=f14e248] [cursor=pointer]:
                        - /url: /primer#problem-decomposition-framework
                      - text: "from the problem statement to identify core operations:"
                    - list [ref=f14e249]:
                      - listitem [ref=f14e250]:
                        - text: "\""
                        - strong [ref=f14e251]: takes
                        - text: a long URL and
                        - strong [ref=f14e252]: generates
                        - text: a shorter alias" → CREATE operation (URL Shortening)
                      - listitem [ref=f14e253]:
                        - text: "\""
                        - strong [ref=f14e254]: redirects
                        - text: users to the original URL" → READ operation (URL Redirection)
                      - listitem [ref=f14e255]:
                        - text: "\""
                        - strong [ref=f14e256]: track
                        - text: link usage" → UPDATE/INCREMENT operation (Analytics)
                    - paragraph [ref=f14e257]: Each verb maps to a functional requirement that defines what the system must do.
                    - list [ref=f14e258]:
                      - listitem [ref=f14e259]:
                        - paragraph [ref=f14e260]: Users should be able to input a long URL and receive a unique, shortened alias. The shortened URL should use a compact format with English letters and digits to save space and ensure uniqueness.
                      - listitem [ref=f14e261]:
                        - paragraph [ref=f14e262]: When users access a shortened URL, the service should redirect them seamlessly to the original URL with minimal delay.
                      - listitem [ref=f14e263]:
                        - paragraph [ref=f14e264]: The system should be able to track the number of times each shortened URL is accessed to provide insights into link usage.
