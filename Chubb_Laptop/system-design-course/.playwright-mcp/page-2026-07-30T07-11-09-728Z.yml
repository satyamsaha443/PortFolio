                        - heading "How can we scale the system to handle high traffic?" [level=3] [ref=f14e536]
                        - generic [ref=f14e537]: Senior
                      - paragraph [ref=f14e539]: To support high traffic and ensure scalability, we implement a sharding strategy that distributes data and load across multiple machines. Sharding allows us to scale horizontally, so as traffic increases, we can add more machines without reconfiguring the entire system.
                      - heading "Scaling with Sharding" [level=4] [ref=f14e540]
                      - paragraph [ref=f14e541]: With ID generation in place, the next step is to scale the system. Request handlers can be easily scaled as they function as independent HTTP servers. However, scaling the ID generator requires a bit more consideration.
                      - heading "Machine ID (Prefix) as Shard Key" [level=4] [ref=f14e542]
                      - paragraph [ref=f14e543]:
                        - text: To horizontally scale the system, we need to
                        - link "shard" [ref=f14e544] [cursor=pointer]:
                          - /url: /fundamentals/database-partitioning
                        - text: "the service. We already have a solution from the previous section: using 1 character for the machine ID. This \"prefix\" serves as the shard key for our ID Generator service."
                        - strong [ref=f14e545]: By sharding the database and ID Generator using the same shard key, each machine corresponds to exactly one database shard
                        - text: . This is a common design pattern. The approach ensures that write paths are completely independent and concurrent so we can scale the entire system by adding more servers without affecting existing ones.
                      - paragraph [ref=f14e546]:
                        - img "URL shortener sharding" [ref=f14e548]
                      - paragraph [ref=f14e550]: "The primary benefits of this approach:"
                      - paragraph [ref=f14e551]:
                        - strong [ref=f14e552]: Scalability
                        - text: ": Adding more machines to the system is straightforward. Each new machine is assigned a unique prefix, allowing it to generate IDs and write to its own shard without impacting the existing setup. This allows the system to handle increased load seamlessly."
                      - paragraph [ref=f14e553]:
                        - strong [ref=f14e554]: Concurrency
                        - text: ": Independent write paths mean that multiple machines can perform"
                        - strong [ref=f14e555]: write operations simultaneously
                        - text: without conflicting with each other. This parallelism enhances the system's overall throughput and efficiency.
                      - paragraph [ref=f14e556]: Additionally, we also get some nice side benefits.
                      - paragraph [ref=f14e557]:
                        - strong [ref=f14e558]: Isolation
                        - text: ": Each machine and its corresponding database shard operate"
                        - strong [ref=f14e559]: independently
                        - text: ", minimizing the risk of system-wide failures. If one machine or shard encounters an issue, it does not affect the others, ensuring higher system reliability."
                      - paragraph [ref=f14e560]:
                        - strong [ref=f14e561]: Simplicity in Data Management
                        - text: ": With each machine handling a distinct shard, data management becomes simpler. Maintenance tasks such as backups, indexing, and scaling can be performed on individual shards without disrupting the entire system."
                      - paragraph [ref=f14e562]:
                        - text: For the read request, if there is a cache miss, we can use the prefix in the short url to find the proper database shard to find the data. For example, if the short url is
                        - code [ref=f14e563]: a82c7w
                        - text: ", the request handler would go to shard"
                        - code [ref=f14e564]: a
                        - text: to find the long url. We could go even further to shard the cache using the same shard key if it becomes necessary
                      - paragraph [ref=f14e565]:
                        - img "URL shortener sharding reading path" [ref=f14e567]
