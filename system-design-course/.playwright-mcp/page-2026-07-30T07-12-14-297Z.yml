              - heading "Design Twitter" [level=1] [ref=f20e229]
              - generic [ref=f20e230]:
                - generic [ref=f20e231]:
                  - paragraph [ref=f20e232]: We aim to design a simplified version of Twitter, a popular social media platform where users can post tweets, follow or unfollow other users, and view the tweets of the people they follow. The platform also includes a recommendation algorithm that suggests content to users based on their preferences and interactions.
                  - generic [ref=f20e233]:
                    - heading "Functional Requirements" [level=2] [ref=f20e234]
                    - list [ref=f20e235]:
                      - listitem [ref=f20e236]:
                        - strong [ref=f20e237]: Tweeting
                        - text: ": Users should be able to write and post new tweets."
                      - listitem [ref=f20e238]:
                        - strong [ref=f20e239]: Follow/Unfollow
                        - text: ": Users should have the ability to follow or unfollow other users."
                      - listitem [ref=f20e240]:
                        - strong [ref=f20e241]: Timeline
                        - text: ": Users should be able to view a list of tweets from the people they follow, as well as content recommended by the recommendation algorithm."
                  - generic [ref=f20e242]:
                    - heading "Non-Functional Requirements" [level=2] [ref=f20e243]
                    - list [ref=f20e244]:
                      - listitem [ref=f20e245]: 300M DAUs
                      - listitem [ref=f20e246]: Each tweet is approximately 140 characters (or 280 bytes)
                      - listitem [ref=f20e247]: Retain data for five years.
                      - listitem [ref=f20e248]: Assuming each user posts one tweet per day.
                      - listitem [ref=f20e249]: High availability
                      - listitem [ref=f20e250]: Low latency
                      - listitem [ref=f20e251]: High durability
                      - listitem [ref=f20e252]: Security
                  - generic [ref=f20e253]:
