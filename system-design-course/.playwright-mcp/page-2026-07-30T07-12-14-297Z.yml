                  - generic [ref=f20e262]:
                    - heading "API Endpoint Design" [level=2] [ref=f20e263]
                    - paragraph [ref=f20e264]: "The API endpoints could include:"
                    - list [ref=f20e265]:
                      - listitem [ref=f20e266]:
                        - code [ref=f20e267]: POST /tweets
                        - text: "for creating a new tweet. Request body as below:"
                        - code [ref=f20e269]: "{ \"content\": \"The content of the new tweet.\" }"
                      - listitem [ref=f20e270]:
