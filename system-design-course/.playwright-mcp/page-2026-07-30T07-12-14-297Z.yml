                        - text: for retrieving timeline tweets.
                  - generic [ref=f20e278]:
                    - heading "High-Level Design" [level=2] [ref=f20e279]
                    - paragraph [ref=f20e280]:
                      - text: Twitter is the perfect example of designing scalable system using our
                      - link "system design template" [ref=f20e281] [cursor=pointer]:
                        - /url: /fundamentals/system-design-template
                      - text: .
                    - paragraph [ref=f20e282]: "The system could be designed with distinct components, specifically the Tweet Service, Follow Service, and Timeline Service. The Design Diagram is as below:"
                    - paragraph [ref=f20e283]:
                      - img "Twitter System Design Diagram" [ref=f20e285]
                    - paragraph [ref=f20e287]: The Tweet Service and Follow Service are used to handle requests for sending tweets, following, and unfollowing. Considering the need for response speed to the client and support for high concurrency, these two services do not directly write into the database, but write the request data into the Message Queue. The Database Updater component reads the request data from the Message Queue, genuinely processes the business logic, writes into the server, and updates the cache.
                    - paragraph [ref=f20e288]: The Timeline Service is used to handle requests for loading Twitter lists. Based on considerations of response speed and improving system efficiency, this service reads data from the cache, rather than accessing the database.
                    - heading "Fan-out-on-write" [level=3] [ref=f20e289]
                    - paragraph [ref=f20e290]: Each user has their own "inbox" inside the cache that stores the tweets to be displayed in its timeline. When a user it follows posts a tweet, the tweet is sent to its "inbox". This is often called "fan-out-on-write" because it replicates ("fans out") a piece of information to multiple destinations at the time of its creation or update. The advantage of this is it significantly enhances the read performance since the tweets are already present in a timeline cache when a user logs in. It reduces the need for complex and time-consuming queries at the time of read. However, for celebrities with millions of followings this could present a problem as the write would be quite large. This is a common follow-up question in Design Twitter interviews. We will cover it in the follow-up question section.
                  - generic [ref=f20e291]:
                    - heading "Detailed Design" [level=2] [ref=f20e292]
                    - heading "Database Type" [level=3] [ref=f20e293]
                    - paragraph [ref=f20e294]: Considering the scale requirement of 300M DAU and assuming that each user sends one tweet per day, this would generate 300M tweets per day, which is a tremendous amount of data. At the same time, this system does not have complex query requirements. Considering these two points, NoSQL could be used as the database.
                    - paragraph [ref=f20e295]: A NoSQL database like Cassandra could be used due to its ability to handle large amounts of data and its high write speed.
                    - heading "Data Schema" [level=3] [ref=f20e296]
                - generic [ref=f20e297]:
                  - generic [ref=f20e298]:
                    - generic [ref=f20e299]:
                      - heading [level=2] [ref=f20e300]:
                        - strong [ref=f20e301]: Grasping the building blocks ("the lego pieces")
                      - paragraph [ref=f20e302]: This part of the guide will focus on the various components that are often used to construct a system (the building blocks), and the design templates that provide a framework for structuring these blocks.
                      - heading "Core Building blocks" [level=3] [ref=f20e303]
                      - paragraph [ref=f20e304]: At the bare minimum you should know the core building blocks of system design
                      - list [ref=f20e305]:
                        - listitem [ref=f20e306]: Scaling stateless services with load balancing
                        - listitem [ref=f20e307]: Scaling database reads with replication and caching
                        - listitem [ref=f20e308]: Scaling database writes with partition (aka sharding)
                        - listitem [ref=f20e309]: Scaling data flow with message queues
                      - heading "System Design Template" [level=3] [ref=f20e310]
                      - paragraph [ref=f20e311]:
                        - text: With these building blocks, you will be able to apply our template to solve many system design problems. We will dive into the details in the
                        - link "Design Template" [ref=f20e312] [cursor=pointer]:
                          - /url: /concepts/design-template
                        - text: "section. Here’s a sneak peak:"
                      - paragraph [ref=f20e313]:
                        - img "System Design Template" [ref=f20e315]
                      - heading "Additional Building Blocks" [level=3] [ref=f20e317]
                      - paragraph [ref=f20e318]: Additionally, you will want to understand these concepts
                      - list [ref=f20e319]:
                        - listitem [ref=f20e320]:
                          - text: Processing large amount of data (aka “big data”) with batch and stream processing
                          - list [ref=f20e321]:
                            - listitem [ref=f20e322]: Particularly useful for solving data-intensive problems such as designing an analytics app
                        - listitem [ref=f20e323]:
                          - text: Achieving consistency across services using distribution transaction or event sourcing
                          - list [ref=f20e324]:
                            - listitem [ref=f20e325]: Particularly useful for solving problems that require strict transactions such as designing financial apps
                        - listitem [ref=f20e326]: "Full text search: full-text index"
                        - listitem [ref=f20e327]: "Storing data for the long term: data warehousing"
                      - paragraph [ref=f20e328]: On top of these, there are ad hoc knowledge you would want to know tailored to certain problems. For example, geohashing for designing location-based services like Yelp or Uber, operational transform to solve problems like designing Google Doc. You can learn these these on a case-by-case basis. System design interviews are supposed to test your general design skills and not specific knowledge.
                    - generic [ref=f20e329]:
                      - heading [level=2] [ref=f20e330]:
                        - strong [ref=f20e331]: Working through problems and building solutions using the building blocks
