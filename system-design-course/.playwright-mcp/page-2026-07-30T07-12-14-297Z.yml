                        - text: for retrieving a user's tweets.
                      - listitem [ref=f20e272]:
                        - code [ref=f20e273]: "POST /follow/{userId}"
                        - text: for following a user.
                      - listitem [ref=f20e274]:
                        - code [ref=f20e275]: "DELETE /follow/{userId}"
                        - text: for unfollowing a user.
                      - listitem [ref=f20e276]:
