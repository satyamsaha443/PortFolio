                  - 'heading "Challenge 3: The System Should be Fast and Responsive" [level=3] [ref=e448]'
                  - paragraph [ref=e449]: User-facing apps must be quick. Response time should be under 500ms. Over 1 second creates poor user experiences.
                  - paragraph [ref=e450]: Reading is usually fast after we have replication. Read requests typically implement as queries to in-memory key-value dictionaries beside HTTP protocols. For many simple apps, latency is mostly network round time.
                  - paragraph [ref=e451]: "Writing is where the challenge lies. Most typical writing processes involve many data queries and updates, lasting far longer than the 1-second limit. The solution is asynchrony: write requests return immediately after servers receive data and put it in queues. Actual processing continues in backends. After receiving server responses, client-side logic has wiggle room for speedy user experiences. It can show UI before redirecting users to read results. This usually takes 1-2 seconds, enough for backend processing of actual write requests."
                  - paragraph [ref=e452]: This implements through message queues like Kafka.
