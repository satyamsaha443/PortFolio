                    - text: The application checks cache before querying the database.
                    - strong [ref=e1783]: Cache hit
                    - text: ": data exists in cache, return immediately."
                    - strong [ref=e1784]: Cache miss
                    - text: ": data absent, query database, store result in cache, return to user."
                  - paragraph [ref=e1785]: Step through requests below. Repeated keys are hits; new keys miss, load from the database, and fill the cache — evicting the least recently used key when it is full.
