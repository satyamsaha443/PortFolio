                  - heading "How would you efficiently support Trends and Hashtags?" [level=3] [ref=e2690]
                  - paragraph [ref=e2691]: Twitter trends and hashtags involve aggregating data across billions of tweets in real-time to identify popular topics. How can we compute and update trends efficiently?
                  - paragraph [ref=e2692]: Enhance existing architecture. Each region or data center computes local trends by aggregating hashtags and keywords using sliding window algorithms (the past 15 minutes). Local results send to global aggregation services, which combine them to generate global trends.
                  - paragraph [ref=e2693]: Modify the Tweet Service to index hashtags upon tweet creation. Maintain inverted indexes where hashtags are keys and associated tweet IDs are values. Use distributed search engines like Elasticsearch or Solr to store and query hashtag indexes efficiently.
                  - paragraph [ref=e2694]: Trends calculate periodically (every minute) and cache in distributed caches like Redis for low-latency access. TTL (time-to-live) ensures trends refresh frequently without overwhelming systems.
                  - heading "How would you handle Tweet Search at Scale?" [level=3] [ref=e2695]
                  - paragraph [ref=e2696]: Search is a core Twitter feature, allowing users to search tweets, hashtags, and profiles. How can we support scalable, real-time search systems?
                  - paragraph [ref=e2697]: Incorporate distributed search architecture. Modify the Tweet Service to send newly created tweets to search indexing services via message queues. Indexing services process tweets and update search indexes in distributed search engines like Elasticsearch or Apache Solr.
                  - paragraph [ref=e2698]: Partition search indexes by time (daily indices) or hashtags to distribute load across multiple nodes. Older indices can store on slower storage systems to save costs while keeping recent indices on faster nodes.
                  - paragraph [ref=e2699]: Use inverted indexing for efficient keyword and hashtag search. Employ ranking algorithms (BM25 or ML-based) to surface most relevant tweets based on user engagement, recency, or other factors.
                  - paragraph [ref=e2700]: Cache popular search queries and results to reduce load on search engines.
