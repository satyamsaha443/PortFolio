                  - heading "Introduction" [level=2] [ref=e118]
                  - paragraph [ref=e119]: System design knowledge matters for two reasons. First, companies test it in interviews, especially at senior levels. Second, it separates competent engineers from exceptional ones. Writing code is table stakes. Designing robust, scalable systems requires deeper expertise.
                - generic [ref=e120]:
                  - heading "What Is System Design?" [level=2] [ref=e121]
                  - paragraph [ref=e122]:
                    - text: System design is the process of defining the architecture, components, modules, interfaces, and data for a system to satisfy specified
                    - strong [ref=e123]: requirements
                    - text: . It is essentially creating a blueprint for a complex software system to ensure it is efficient, reliable, and scalable.
                  - paragraph [ref=e124]:
                    - text: System design is the art of making technical trade-offs to turn a vague problem into a scalable solution. It is not just about connecting boxes; it is about justifying why you connected them that way based on
                    - strong [ref=e125]: constraints
