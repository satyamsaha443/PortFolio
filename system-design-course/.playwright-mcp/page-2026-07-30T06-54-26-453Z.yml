                  - heading "Consistency and Tradeoffs" [level=2] [ref=e1087]
                  - paragraph [ref=e1088]: Replication and asynchronous updates buy scale, but they let readers see stale or conflicting data. Challenge 4 above named this problem; this section is about choosing — deliberately — how correct the system must be, and paying only for what you need. Consistency questions dominate L6 interviews.
                  - heading "The CAP Theorem" [level=3] [ref=e1089]
                  - paragraph [ref=e1090]:
                    - text: "CAP says a distributed store can hold only two of three properties at once:"
                    - strong [ref=e1091]: Consistency
                    - text: (every read sees the latest write),
                    - strong [ref=e1092]: Availability
                    - text: (every request gets a response), and
                    - strong [ref=e1093]: Partition tolerance
                    - text: (it keeps working when the network drops messages between nodes). The diagram shows the three as overlapping circles. Each pairwise overlap is a combination you can actually have, with example databases that live there — highlight a pair to focus it.
