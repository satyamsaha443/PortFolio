                  - paragraph [ref=e1467]:
                    - strong [ref=e1468]: Message queues
                    - text: are essential to scaling out systems to handle write requests. Producers insert messages into queues. Consumers retrieve and process messages asynchronously.
                  - paragraph [ref=e1469]: The necessity of message queues arises from varying processing rates (producers and consumers handle data at different speeds, necessitating buffers) and fault tolerance (they ensure persistence of messages, preventing data loss during failures).
                - generic [ref=e1470]:
                  - heading "Main Components" [level=2] [ref=e1471]
                  - paragraph [ref=e1472]: Common system design problems have been solved. Engineers developed reusable tools called components. These fit into most systems.
                  - paragraph [ref=e1473]: System design interviews test your ability to assemble components correctly. Learn how each technology works and when to use it. That's the game.
                  - paragraph [ref=e1474]: "Each component section follows this structure: first, the problem it solves and when to use it. Second, how it works technically. Third, common implementations with trade-offs."
                  - heading "Microservices" [level=3] [ref=e1475]
                  - heading "The Problem" [level=4] [ref=e1476]
                  - paragraph [ref=e1477]: "A startup builds an e-commerce application. Everything lives in one codebase: product catalog, checkout, payments, user accounts. The application processes 100 orders per day. This monolithic approach works."
                  - paragraph [ref=e1478]: Two years later, traffic grows to 10,000 orders per day. The checkout service needs more servers. But you can't scale just checkout. You must scale the entire monolith. The payment team wants to deploy fraud detection. They can't. Deploying requires coordinating with every other team. A bug in the catalog crashes the entire application, taking down checkout and payments.
                  - paragraph [ref=e1479]: "Microservices solve this by splitting applications into independent services, each handling one business function. An e-commerce system splits into separate services: Product Service, Cart Service, User Service, Order Service, Payment Service. Each service deploys independently, scales independently, and fails independently."
                  - generic "Click to enlarge" [ref=e1480]:
                    - document [ref=e1481]:
                      - generic [ref=e1489]:
                        - generic [ref=e1490]: API gateway
                        - generic [ref=e1495]: Product service
                        - generic [ref=e1500]: Cart service
                        - generic [ref=e1505]: Order service
                        - generic [ref=e1510]: Payment service
                        - generic [ref=e1515]: Product DB
                        - generic [ref=e1520]: Order DB
                        - generic [ref=e1525]: Payment DB
                  - heading "How Microservices Work" [level=4] [ref=e1530]
                  - paragraph [ref=e1531]: Each service runs as a separate process. Services communicate through APIs, typically REST over HTTP or gRPC. The Payment Service calls the Order Service to verify order details. The Order Service calls the Inventory Service to check stock. No service talks directly to another service's database.
                  - generic "Click to enlarge" [ref=e1532]:
                    - document [ref=e1533]:
                      - generic [ref=e1535]:
                        - generic [ref=e1539]:
                          - generic [ref=e1540]: REST or gRPC
                          - generic [ref=e1544]: REST or gRPC
                        - generic [ref=e1548]:
                          - generic [ref=e1549]: Payment service
                          - generic [ref=e1554]: Order service
                          - generic [ref=e1559]: Inventory service
                          - generic [ref=e1564]: Order DB
                          - generic [ref=e1569]: Inventory DB
                  - paragraph [ref=e1574]: Each service owns its database. The User Service manages the User Database. The Order Service manages the Order Database. This prevents tight coupling. If the User Service changes its database schema, other services don't break.
                  - paragraph [ref=e1575]:
                    - text: Services register with a
                    - strong [ref=e1576]: service registry
                    - text: (like Consul or Eureka). When the Payment Service starts, it announces its location. When another service needs to call Payment Service, it asks the registry where to find it. This is
                    - strong [ref=e1577]: service discovery
                    - text: .
                  - paragraph [ref=e1578]: Services scale independently. Black Friday hits and checkout traffic spikes. Spin up 10 more Order Service instances. The Product Service continues running with just 2 instances. Different services have different load patterns.
                  - paragraph [ref=e1579]:
                    - strong [ref=e1580]: Fault isolation
                    - text: prevents cascading failures. If the Recommendation Service crashes, checkout still works. Services use circuit breakers to detect failures and stop sending requests to broken services.
                  - paragraph [ref=e1581]:
                    - text: For deeper understanding of microservices architecture, communication patterns, and service mesh, see
                    - link "Microservices and Monolithic Architecture" [ref=e1582] [cursor=pointer]:
                      - /url: /fundamentals/microservices
                    - text: .
                  - heading "Common Implementations" [level=4] [ref=e1583]
                  - paragraph [ref=e1584]: Spring Boot is the standard for Java microservices. It includes built-in support for REST APIs, service discovery, and distributed tracing. Use it for enterprise systems requiring mature tooling and strong typing.
                  - paragraph [ref=e1585]: Node.js with Express works well for lightweight microservices. It offers fast development and a large npm ecosystem. Use it for TypeScript microservices or teams preferring JavaScript.
                  - paragraph [ref=e1586]: Go with frameworks like Gin or Echo delivers high performance with built-in concurrency. Use it for high-throughput services requiring low latency, like real-time bidding or stream processing.
                  - heading "Relational Databases" [level=3] [ref=e1587]
                  - heading "The Problem" [level=4] [ref=e1588]
                  - paragraph [ref=e1589]: A bank processes money transfers. User A sends $100 to User B. The system must subtract $100 from A's account and add $100 to B's account. Both operations must succeed or both must fail. Partial completion is unacceptable. User A loses $100 but User B never receives it.
                  - paragraph [ref=e1590]:
                    - text: This requires
                    - strong [ref=e1591]: consistency
                    - text: . Data must remain accurate across related records. Relational databases solve this through structured storage and ACID transactions.
                  - paragraph [ref=e1592]: Relational databases organize data into tables. Each table has rows and columns. A Users table has columns for user_id, name, and email. Each row represents one user. Tables link through relationships. An Orders table references Users through a user_id column.
                  - paragraph [ref=e1593]: Use relational databases when consistency is critical. Financial transactions, inventory management, and user account systems require accurate, structured data. NoSQL offers flexibility. Relational databases offer guarantees.
                  - heading "How Relational Databases Work" [level=4] [ref=e1594]
                  - paragraph [ref=e1595]: "Tables store structured data. Each table represents an entity: Users, Orders, Products. Columns define the schema: data types and constraints. Rows contain actual records."
                  - generic "Click to enlarge" [ref=e1596]:
