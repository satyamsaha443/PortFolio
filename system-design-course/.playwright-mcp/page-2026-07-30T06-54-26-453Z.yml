                      - /url: /domain-knowledge/distributed-database-cap-and-pacelc-theorem
                    - text: .
                  - heading "Common Implementations" [level=4] [ref=e1711]
                  - paragraph [ref=e1712]: MongoDB is the most popular document database. It supports rich queries including filters, aggregations, and text search. Use it for applications where documents have varying schemas, like product catalogs or user-generated content.
                  - paragraph [ref=e1713]: "Redis is an in-memory key-value store delivering sub-millisecond latency. It supports data structures beyond simple values: lists, sets, sorted sets. Use it for caching, real-time leaderboards, and rate limiting."
                  - paragraph [ref=e1714]: Apache Cassandra is a distributed column-family database with no single point of failure. It handles millions of writes per second by distributing data across nodes. Use it for time-series data, event logging, and high-write applications.
                  - paragraph [ref=e1715]: Amazon DynamoDB is a fully managed key-value and document database. It auto-scales and offers single-digit millisecond latency at any scale. Use it for serverless applications or unpredictable traffic patterns.
                  - heading "Object Storage" [level=3] [ref=e1716]
                  - heading "The Problem" [level=4] [ref=e1717]
                  - paragraph [ref=e1718]: Netflix stores 100 million video files. Users upload profile pictures. YouTube hosts billions of thumbnails. These files vary in size from kilobytes to gigabytes. Storing them in relational databases is inefficient. Databases optimize for structured queries, not large binary files.
                  - paragraph [ref=e1719]: File systems work but don't scale. A single server holds limited storage. Adding more servers requires manual partitioning logic. Replication for durability becomes complex. Accessing files requires knowing which server holds them.
                  - paragraph [ref=e1720]:
                    - text: Object storage solves this by treating each file as an object with a unique ID. Store a video with key
                    - code [ref=e1721]: videos/user123/vacation.mp4
                    - text: . Retrieve it later using that key. The system handles distribution, replication, and scaling automatically.
                  - paragraph [ref=e1722]: Use object storage for static assets like images and videos. Use it for backups requiring long-term retention. Use it for data lakes storing raw data for analytics. Don't use it for frequently updated files or low-latency operations.
                  - heading "How Object Storage Works" [level=4] [ref=e1723]
                  - paragraph [ref=e1724]:
                    - text: "Objects live in buckets. A bucket is a container holding millions of objects. Each object has three parts: a unique key (like"
                    - code [ref=e1725]: photos/cat.jpg
                    - text: ), binary data (the actual file), and metadata (size, content type, custom tags).
                  - generic "Click to enlarge" [ref=e1726]:
                    - document [ref=e1727]:
                      - generic [ref=e1729]:
                        - generic [ref=e1733]: PUT object
                        - generic [ref=e1738]:
                          - generic [ref=e1739]: Client
                          - generic [ref=e1744]: Bucket
                          - generic [ref=e1749]: key + bytes + metadata
                          - generic [ref=e1754]: key + bytes + metadata
                  - paragraph [ref=e1759]:
                    - text: There are no folders. Keys look like file paths but the storage is flat. The key
                    - code [ref=e1760]: images/2024/cat.jpg
                    - text: is just a string. No
                    - code [ref=e1761]: /images/
                    - text: directory exists.
                  - paragraph [ref=e1762]: Clients interact through RESTful APIs. Upload with PUT requests. Download with GET requests. Delete with DELETE requests. The API abstracts the underlying distributed storage.
                  - paragraph [ref=e1763]: Object storage replicates data across multiple nodes and regions. Upload a file and the system automatically copies it to 3+ servers. If one server fails, replicas ensure data survives. This achieves high durability.
                  - paragraph [ref=e1764]:
                    - strong [ref=e1765]: Versioning
                    - text: keeps multiple versions of the same object. Overwrite
                    - code [ref=e1766]: report.pdf
                    - text: and the old version remains accessible. This protects against accidental deletions.
                    - strong [ref=e1767]: Lifecycle policies
                    - text: automatically move old objects to cheaper storage tiers after 90 days or delete them after one year.
                  - paragraph [ref=e1768]: Consistency models vary. S3 offers strong read-after-write consistency. Upload an object and immediately read it. Eventual consistency is cheaper but reads might return stale data briefly.
                  - paragraph [ref=e1769]:
                    - text: For detailed coverage of object storage systems and blob storage patterns, see
                    - link "Object Storage and Blob Storage" [ref=e1770] [cursor=pointer]:
                      - /url: /fundamentals/blob-object-storage
                    - text: .
                  - heading "Common Implementations" [level=4] [ref=e1771]
                  - paragraph [ref=e1772]: Amazon S3 is the industry standard. It offers virtually unlimited storage, automatic replication, and integration with AWS services. Use it for most object storage needs, especially in AWS environments.
                  - paragraph [ref=e1773]: Google Cloud Storage provides multi-regional storage with strong consistency. It integrates tightly with BigQuery for analytics. Use it for Google Cloud applications or when running analytics on stored data.
                  - paragraph [ref=e1774]: Azure Blob Storage is Microsoft's object storage. It offers hot, cool, and archive tiers for cost optimization. Use it for Azure-based applications or hybrid cloud scenarios.
                  - heading "Cache" [level=3] [ref=e1775]
                  - heading "The Problem" [level=4] [ref=e1776]
                  - paragraph [ref=e1777]: An e-commerce site displays product pages. Each page load queries the database for product details, price, and inventory. The database handles 1,000 requests per second. Most requests fetch the same 100 popular products repeatedly.
                  - paragraph [ref=e1778]: Database queries take 50ms each. Users experience slow page loads. The database CPU hits 90%. Adding more database servers is expensive. Most queries return identical data from minutes ago.
                  - paragraph [ref=e1779]: Caching solves this. Store frequently accessed data in fast memory. Serve repeated requests from cache instead of hitting the database. Response time drops from 50ms to 1ms. Database load drops by 80%.
                  - paragraph [ref=e1780]: Use caching when reads vastly outnumber writes. Use it when staleness is acceptable (product prices can be 5 minutes old). Use it to reduce database load and improve response times.
                  - heading "How Caches Work" [level=4] [ref=e1781]
