                  - heading "Separating Read and Write" [level=3] [ref=e916]
                  - paragraph [ref=e917]: Whether systems are read-heavy or write-heavy depends on business requirements. Social media platforms are read-heavy because users read more than they write. IoT systems are write-heavy because users write more than they read. This is why we separate read and write operations to treat them differently.
                  - paragraph [ref=e918]: Read and write separation typically involves two main strategies. First, replication implements leader-follower architecture where writes occur on the leader and followers provide read replicas.
                  - generic "Click to enlarge" [ref=e919]:
                    - document [ref=e920]:
                      - generic [ref=e928]:
                        - generic [ref=e929]: Writes
                        - generic [ref=e934]: Leader
                        - generic [ref=e939]: Follower
                        - generic [ref=e944]: Follower
                        - generic [ref=e949]: Reads
                  - paragraph [ref=e954]: "Second, the CQRS (Command Query Responsibility Segregation) pattern takes read-write separation further by using completely different models for reading and writing data. In CQRS, systems split into two parts: the command side (write side) handles all write operations (create, update, delete) using data models optimized for writes, and the query side (read side) handles all read operations using denormalized data models optimized for reads."
                  - paragraph [ref=e955]: Changes from the command side asynchronously propagate to the query side.
