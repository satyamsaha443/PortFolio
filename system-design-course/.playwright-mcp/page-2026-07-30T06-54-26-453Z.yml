                  - 'heading "Challenge 2: Too Much Data to Move Around" [level=3] [ref=e410]'
                  - paragraph [ref=e411]: "The twin challenge of too many users is too much data. Data becomes big when it's no longer possible to hold everything on one machine. Examples: Google index, all tweets on Twitter, all Netflix movies."
                  - paragraph [ref=e412]: "The solution is sharding: partitioning data by logic. Sharding logic groups data together. If we shard by user_id in Twitter, all tweets from one user store on the same machine."
                  - generic "Click to enlarge" [ref=e413]:
