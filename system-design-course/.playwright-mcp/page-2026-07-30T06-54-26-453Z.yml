                  - heading "Component Breakdown" [level=3] [ref=e1341]
                  - paragraph [ref=e1342]:
                    - strong [ref=e1343]: Stateless Services
                    - text: are scalable and can be expanded by adding new machines and integrating them through load balancers. Write Service receives client requests and forwards them to message queues. Read Service handles read requests from clients by accessing caches.
                  - paragraph [ref=e1344]:
                    - strong [ref=e1345]: Databases
                    - text: serve as cold storage and source of truth. We do not normally read directly from databases since it can be slow when request volume is high.
                  - paragraph [ref=e1346]:
                    - strong [ref=e1347]: Message Queues
                    - text: buffer between writer services and data storage. Producers (comprised of write services) send data changes to queues. Consumers update both databases and caches. Database Updater (asynchronous workers) updates databases by retrieving jobs from message queues. Cache Updater (asynchronous workers) refreshes caches by fetching jobs from message queues.
                  - paragraph [ref=e1348]:
                    - strong [ref=e1349]: Caches
                    - text: facilitate fast and efficient read operations.
                  - heading "Dataflow Path" [level=3] [ref=e1350]
                  - paragraph [ref=e1351]: Almost all applications break down into read requests and write requests. Because read and write have completely different implications (read doesn't mutate; write mutates database), we discuss write path and read path separately.
                  - paragraph [ref=e1352]:
                    - strong [ref=e1353]: Read path
                    - text: ": For modern large-scale applications with millions of daily users, we almost always read from cache instead of from databases directly. Databases act as permanent storage solutions. Asynchronous jobs frequently transfer data from databases to caches."
                  - paragraph [ref=e1354]:
                    - strong [ref=e1355]: Write path
                    - text: ": Write requests push into message queues, allowing backend workers to manage writing processes. This approach balances processing speeds of different system components, offering responsive user experiences."
                  - paragraph [ref=e1356]: The write path accepts the request, enqueues it, and returns immediately; a worker persists to the database and updates the cache asynchronously.
