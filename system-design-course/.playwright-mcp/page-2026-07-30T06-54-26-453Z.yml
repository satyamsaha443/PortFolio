                  - heading "Buffer with Message Queues" [level=3] [ref=e828]
                  - paragraph [ref=e829]: High-concurrency scenarios often encounter write-intensive operations. Frequent database writes can overload systems due to disk I/O bottlenecks. Message queues buffer write requests, changing synchronous operations into asynchronous ones, thereby limiting database write requests to manageable levels and preventing system crashes.
