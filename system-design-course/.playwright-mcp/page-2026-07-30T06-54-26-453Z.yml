                          - generic [ref=e994]: Read model
                  - paragraph [ref=e999]: For example, systems might use MySQL as source-of-truth databases while employing Elasticsearch for full-text search or analytical queries, and asynchronously sync changes from MySQL to Elasticsearch using MySQL binlog Change Data Capture (CDC).
                  - heading "Combining Techniques" [level=3] [ref=e1000]
                  - paragraph [ref=e1001]: Effective scaling usually requires multi-faceted approaches combining several techniques. Start with decomposition to break down monolithic services for independent scaling. Then, partitioning and caching work together to distribute load efficiently while enhancing performance. Read/write separation ensures fast reads and reliable writes through leader-replica setups. Finally, business logic adjustments help design strategies that mitigate operational bottlenecks without compromising user experience.
                  - paragraph [ref=e1002]: A combined architecture puts each technique against a different pressure — the load balancer spreads traffic, the cache absorbs reads, the queue buffers writes, and the sharded primary-replica database scales storage and reads.
