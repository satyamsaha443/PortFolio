                    - text: "is a useful middle ground: you always see your own updates, even if others see them late."
                  - paragraph [ref=e1164]: These levels differ only in what a read may return in the moments just after a write, while replicas are still catching up. The widget below commits a new value, then shows what two readers — the author who wrote it and another user — see as the replica syncs. Switch the level to compare.
