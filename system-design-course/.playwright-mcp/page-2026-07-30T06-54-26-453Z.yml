                  - paragraph [ref=e165]: The skills overlap but the emphasis differs. Object-oriented design emphasizes clean code and maintainability. System design emphasizes performance, reliability, and cost at scale.
                - generic [ref=e166]:
                  - heading "What Are System Design Interviews?" [level=2] [ref=e167]
                  - paragraph [ref=e168]: Writing code becomes less central as careers progress. Companies need engineers who design systems that handle high traffic, make decisions balancing cost and performance, and lead technical discussions. System design interviews assess these capabilities.
                  - paragraph [ref=e169]: These interviews appear at mid-level and becomes central to senior positions. At senior levels, engineers contribute to application architecture and make design choices affecting entire systems. Interviews simulate real-world scenarios involving scalability, fault tolerance, and performance.
                  - paragraph [ref=e170]: System design takes years to master. Real systems require thousands of hours of work. Demonstrating competence in 45 minutes presents a unique challenge.
                  - heading "What System Design Interviews Test" [level=3] [ref=e171]
                  - paragraph [ref=e172]: System design interviews test soft skills more than raw knowledge. Can you break down vague, open-ended problems into solvable parts? Do you understand how components interact? Can you design scalable, reliable, maintainable systems?
                  - paragraph [ref=e173]: Every design decision has trade-offs. Explain why you chose one approach over another. Communication matters as much as technical depth. Clear explanations are essential for collaborating with teams and stakeholders in real settings. System design rarely follows a straight path. Adjust your approach based on new constraints or feedback.
                - generic [ref=e174]:
                  - heading "Level Expectations" [level=2] [ref=e175]
                  - paragraph [ref=e176]: Interview expectations change dramatically with seniority. Understanding what your level requires prevents wasted preparation.
                  - paragraph [ref=e177]: The single biggest difference between levels is the ability to handle ambiguity. Junior engineers receive well-defined problems with clear requirements. Senior engineers face deliberately vague problems requiring clarification and decomposition. Staff engineers navigate extreme ambiguity, defining the problem space itself.
                  - paragraph [ref=e178]: "This manifests in problem complexity. L4 problems have simple contracts: given input A, return output B. L5 problems combine 2-3 concepts with some flexibility. L6 problems either combine 4-5 subsystems or present abstract requirements needing significant clarification before design begins."
