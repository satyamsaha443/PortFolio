                  - heading "How to Prepare" [level=2] [ref=e211]
                  - heading "The Memorization Trap" [level=3] [ref=e212]
                  - paragraph [ref=e213]: "The prevailing approach is: find popular system design problems, watch YouTube videos showing solutions, read blog posts with architectural diagrams, memorize the answers, repeat."
                  - paragraph [ref=e214]: "This works at first. You watch a video explain how to design Twitter. The solution makes sense: microservices, message queues, Redis cache, Cassandra database. You memorize the architecture. In your interview, you get asked to design Twitter. You draw the diagram from memory."
                  - paragraph [ref=e215]: The strategy may work but as more and more interviewers recognize the cookie-cutter answers, the strategy fails.
                  - paragraph [ref=e216]: First, you freeze when facing unfamiliar problems. You memorized 30 solutions. The interviewer asks you to design something you haven't seen. You try adapting your Twitter design to fit. It doesn't work cleanly. You stumble. The interviewer notices.
                  - paragraph [ref=e217]: Second, interviewers recognize memorized answers. Hundreds of candidates have watched the same videos and read the same blog posts. When your Twitter design matches the popular YouTube solution exactly, the interviewer's instincts activate. They probe deeper. You can't answer because you memorized the what, not the why. For L5+ interviews, the cookie-cutter answers may only be enough talking points for the first 15-20min, the interviewer will probe deeper and deeper until they find the edge of your knowledge.
                  - paragraph [ref=e218]: Third, the approach completely fails at L6+. Senior interviews require deep understanding. These interviews are mostly about deep dives It would become obvious whether you have actual experience or not. The interviewer asks follow-up questions until they find the edge of your knowledge. Memorized facts crumble quickly under pressure.
                  - heading "The Better Approach" [level=3] [ref=e219]
                  - paragraph [ref=e220]: Learn the fundamentals. Understand how things actually work. Build genuine technical depth.
                  - paragraph [ref=e221]: For L4-L5 engineers with limited time, the hybrid approach works best. Master the common patterns and the templates. Study 10-15 common problems to internalize the template. But for each problem, don't just memorize the solution. Understand why each component exists. Question every design choice. What happens if we remove the cache? Why Cassandra instead of PostgreSQL? Why Redis over Memcached?
                  - paragraph [ref=e222]: This deeper engagement transforms memorization into understanding. When you face unfamiliar problems, you recognize patterns. You adapt rather than freeze.
                  - heading "Why System Design School Exists" [level=3] [ref=e223]
                  - paragraph [ref=e224]: System Design School takes the fundamentals-first approach. You won't find memorizable Twitter solutions. You'll find building blocks for constructing any solution.
                  - paragraph [ref=e225]: "This primer provides a quick crash course: essential components, interview templates, and the mental models needed to solve common problems. It's designed for rapid learning and last-minute preparation."
                  - paragraph [ref=e226]: "The full course goes deep. It's organized into two main tracks:"
