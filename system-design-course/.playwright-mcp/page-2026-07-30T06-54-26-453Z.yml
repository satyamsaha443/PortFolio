                  - heading "Applying Constraints" [level=3] [ref=e2465]
                  - paragraph [ref=e2466]: We have basic data flow supporting the use cases. This system works but fails at scale. Now apply the constraints identified in Step 2.
                  - paragraph [ref=e2467]: "We identified four constraints: low latency, high availability, scalability, and durability. Address each constraint by adding the corresponding components. The biggest candidate mistake is adding components without justifying them."
                  - paragraph [ref=e2468]:
                    - text: Start with
                    - strong [ref=e2469]: scalability
                    - text: . This is relatively straightforward to address. Our goal is supporting horizontal scaling to handle user base growth and increased traffic seamlessly. Horizontal scaling adds more service instances to handle higher loads, ensuring consistent performance as demand increases.
                  - generic "Click to enlarge" [ref=e2470]:
                    - document [ref=e2471]:
                      - generic [ref=e2479]:
                        - generic [ref=e2480]: API gateway
                        - generic [ref=e2485]: Tweet service ×N
