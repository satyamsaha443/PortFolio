                  - paragraph [ref=e1631]:
                    - strong [ref=e1632]: Primary keys
                    - text: uniquely identify each row. The Users table has user_id as its primary key. No two users share the same user_id.
                    - strong [ref=e1633]: Foreign keys
                    - text: create relationships between tables. The Orders table has a user_id column referencing the Users table. This links each order to a specific user.
                  - paragraph [ref=e1634]: "Three relationship types exist:"
                  - list [ref=e1635]:
                    - listitem [ref=e1636]:
                      - strong [ref=e1637]: One-to-one
                      - text: ": each user has exactly one profile"
                    - listitem [ref=e1638]:
                      - strong [ref=e1639]: One-to-many
                      - text: ": one user has many orders"
                    - listitem [ref=e1640]:
                      - strong [ref=e1641]: Many-to-many
                      - text: ": many students enroll in many classes, requiring a junction table storing both student_id and class_id"
                  - paragraph [ref=e1642]: "ACID properties guarantee data correctness:"
                  - list [ref=e1643]:
                    - listitem [ref=e1644]:
                      - strong [ref=e1645]: Atomic
                      - text: ": transactions complete fully or not at all"
                    - listitem [ref=e1646]:
                      - strong [ref=e1647]: Consistent
                      - text: ": transactions move the database from one valid state to another"
                    - listitem [ref=e1648]:
                      - strong [ref=e1649]: Isolated
                      - text: ": concurrent transactions don't interfere"
                    - listitem [ref=e1650]:
                      - strong [ref=e1651]: Durable
                      - text: ": committed transactions persist even after crashes"
                  - paragraph [ref=e1652]: SQL enables powerful queries. Join tables to combine data. Filter with WHERE clauses. Aggregate with GROUP BY. This expressiveness makes relational databases ideal for complex business logic.
                  - paragraph [ref=e1653]:
                    - text: For comprehensive coverage of relational databases, indexing strategies, and query optimization, see
                    - link "Relational Database Fundamentals" [ref=e1654] [cursor=pointer]:
                      - /url: /fundamentals/sql-database
                    - text: and
                    - link "Database Partitioning" [ref=e1655] [cursor=pointer]:
                      - /url: /fundamentals/database-partitioning
                    - text: .
                  - heading "Common Implementations" [level=4] [ref=e1656]
                  - paragraph [ref=e1657]: PostgreSQL is the most feature-rich open-source relational database. It supports advanced data types (JSON, arrays), full-text search, and custom functions. Use it for applications requiring complex queries or analytical workloads alongside transactional operations.
                  - paragraph [ref=e1658]: MySQL is the most widely deployed open-source relational database. It offers excellent read performance and straightforward replication. Use it for web applications prioritizing simplicity and broad hosting support.
                  - paragraph [ref=e1659]: Amazon RDS is a managed relational database service supporting PostgreSQL, MySQL, and others. It handles backups, patches, and scaling automatically. Use it for cloud-based applications avoiding operational overhead.
                  - heading "NoSQL Databases" [level=3] [ref=e1660]
                  - heading "The Problem" [level=4] [ref=e1661]
                  - paragraph [ref=e1662]: Instagram stores user posts. Each post has an image, caption, hashtags, location, timestamp, and comments. Comments contain text, author, and nested replies. Fitting this into relational tables requires many joins. The Posts table joins to Comments, which joins to Users, which joins to Locations. Reading one post requires querying five tables.
                  - paragraph [ref=e1663]: The schema changes weekly. Product adds "story reactions" one week and "polls" the next. Each schema change requires database migrations coordinating across teams. Development slows.
                  - paragraph [ref=e1664]: "NoSQL databases solve this by storing flexible, nested data without rigid schemas. One document stores everything: post image, caption, comments array, location object. No joins required. Schema changes don't require migrations."
                  - paragraph [ref=e1665]: Use NoSQL when data structure varies by record. Use it when you add new fields frequently. Use it when scaling to millions of writes per second across distributed servers. Trade relational guarantees for flexibility and horizontal scalability.
                  - heading "How NoSQL Databases Work" [level=4] [ref=e1666]
                  - paragraph [ref=e1667]: NoSQL databases come in four types, each optimized for different access patterns.
                  - paragraph [ref=e1668]: Click each type to see the concrete shape its data takes.
