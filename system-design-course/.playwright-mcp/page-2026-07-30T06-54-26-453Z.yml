                        - generic [ref=e2534]: Feed service ×N
                  - paragraph [ref=e2539]: A load balancer ensures incoming requests distribute evenly across available service instances. It performs health checks monitoring each instance's status and reroutes traffic away from unhealthy instances, ensuring high availability. This addresses another non-functional requirement and is a bonus from the load balancer. Scale each service dynamically based on traffic patterns. During peak hours, spin up more Feed Service instances to handle request surges, then scale back during lower activity to optimize resource usage.
                  - paragraph [ref=e2540]: "Move to another core non-functional requirement: low latency. With few users posting tweets, servers run fast. Each user's feed fetches a handful of tweets. As we scale to millions of users and billions of tweets, accessing the database for every feed request becomes exponentially slow. Users writing tweets to the database, then feeds re-pulling these from the database each time is redundant."
                  - paragraph [ref=e2541]: Caches solve this.
                  - generic "Click to enlarge" [ref=e2542]:
                    - document [ref=e2543]:
                      - generic [ref=e2549]:
                        - generic [ref=e2550]: Feed service
                        - generic [ref=e2555]: Feed cache
                        - generic [ref=e2560]: Tweet DB
                  - paragraph [ref=e2565]: A cache is high-speed data storage storing frequently accessed data closer to applications. The Feed Service could leverage distributed caching like Redis or Memcached to store recent tweets for each user.
                  - paragraph [ref=e2566]: When users post tweets, the Feed Service doesn't just update followers' feeds in the database. It also pushes new tweets to cache, storing them as part of precomputed feeds for followers. When followers log in, the Feed Service fetches feed data directly from cache instead of querying the database or relying on real-time aggregation.
                  - paragraph [ref=e2567]: "Caches are ideal for storing hot data: data accessed frequently, like latest tweets for user feeds. Since caches operate in memory, they deliver data in milliseconds, reducing response times and improving user experiences."
                  - paragraph [ref=e2568]: By offloading repeated reads to cache, we reduce database load. This makes systems more scalable and ensures databases are available for other critical write operations.
                  - paragraph [ref=e2569]: To ensure cache stays fresh, set expiry times for cached items or use event-driven update models. When new tweets post, events trigger cache updates, ensuring followers see latest tweets without delays.
                  - paragraph [ref=e2570]:
                    - text: When adding load balancers earlier, we touched on how health checks help maintain high availability. But what else maintains
                    - strong [ref=e2571]: high availability
                    - text: "? Consider a situation where we might not have availability with the current system. A user posts a tweet at 1:02pm. At 1:03pm, the tweet service goes down. At 1:04pm, their followers log onto the app. Are followers going to see this tweet in their feed? No. Another scenario: millions of active users publish tweets simultaneously. Trying to process them all simultaneously would overload servers. Message queues solve this."
                  - generic "Click to enlarge" [ref=e2572]:
                    - document [ref=e2573]:
                      - generic [ref=e2582]:
                        - generic [ref=e2583]: Tweet service
                        - generic [ref=e2588]: Message queue
                        - generic [ref=e2593]: Consumer
                        - generic [ref=e2598]: Feed cache
                        - generic [ref=e2603]: Tweet DB
                        - generic [ref=e2608]: Feed service
                  - paragraph [ref=e2613]: A message queue acts as a buffer between services, decoupling dependencies and ensuring messages (like new tweets) aren't lost even if services experience downtime. When users post tweets, the Tweet Service doesn't directly communicate with the Feed Service. Instead, it places tweets in a queue. Consumers process the queue and add to both database and cache. The Feed Service, which processes tweets to update user feeds, reads from this cache. Even if the Tweet Service goes offline, messages (tweets) are safely stored in the queue and processed by consumers. The Feed Service can still update followers' feeds when they log in.
                  - paragraph [ref=e2614]: Incorporating message queues ensures eventual consistency and high availability during partial system failures. In our scenario, followers would still see tweets in feeds thanks to queues ensuring no message loss. Decoupling services also helps scalability. Queues handle varying workloads and traffic spikes without overwhelming downstream services. Message queues like RabbitMQ, Kafka, or AWS SQS are built for durability and reliability, making them perfect for our use case.
                  - paragraph [ref=e2615]: "We've addressed service non-functional requirements. One last critical requirement remains: data durability. In systems handling billions of tweets, likes, and follows, ensuring data is never lost is essential. Once lost, we cannot recover it. How do we prevent this? Use distributed databases."
                  - generic "Click to enlarge" [ref=e2616]:
                    - document [ref=e2617]:
                      - generic [ref=e2623]:
                        - generic [ref=e2624]: Consumer
                        - generic [ref=e2629]: Tweet DB primary
                        - generic [ref=e2634]: Replica
                        - generic [ref=e2639]: Replica
                  - paragraph [ref=e2644]: Distributed databases replicate and store data across multiple cluster nodes. Distributed databases like Amazon DynamoDB, Google Cloud Spanner, or Cassandra automatically replicate data across multiple nodes. Even if one node goes down, data remains accessible from other replicas. Additionally, distributed databases provide built-in mechanisms for point-in-time recovery and automated backups. Regular snapshots of Tweet DB, Follow DB, and Engagement DB can be taken and stored in separate backup systems. If complete failure occurs, data can be restored to its last consistent state.
                  - heading "Deep Dives" [level=3] [ref=e2645]
                  - paragraph [ref=e2646]: Deep dives are the last step of system design interviews. They focus on addressing higher-level, more specific challenges or edge cases in your system. They go beyond high-level architecture to test understanding of advanced features, domain-specific scenarios, and trade-offs.
                  - heading "How would you handle the Celebrity Problem?" [level=3] [ref=e2647]
                  - paragraph [ref=e2648]: The celebrity problem arises when users with millions of followers post tweets, creating massive fan-out as their tweets need adding to millions of follower feeds. This can overwhelm systems leading to latency and high write amplification.
                  - paragraph [ref=e2649]: Toggle the strategy below. Push (fan-out-on-write) copies each post into every follower's timeline; above a follower threshold, hybrid switches that author to pull (fan-out-on-read) so one viral post costs zero timeline writes.
                  - generic [ref=e2650]:
