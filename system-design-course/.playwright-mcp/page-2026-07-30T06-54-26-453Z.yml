                  - heading "High-Level Design" [level=3] [ref=e2296]
                  - paragraph [ref=e2297]: High-level design is the bulk of the interview. Combine work from earlier steps with system design knowledge. This takes around 15-20 minutes but varies by level. Juniors spend more time here. Seniors move to deep dives more quickly.
                  - paragraph [ref=e2298]: We identified use cases (Step 0), entities (Step 1), and constraints (Step 2). Now build the architecture. Start with basic data flow supporting the use cases. Then layer in components addressing each constraint.
                  - blockquote [ref=e2299]:
