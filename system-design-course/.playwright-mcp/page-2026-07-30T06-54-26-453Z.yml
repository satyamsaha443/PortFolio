                  - paragraph [ref=e1218]:
                    - text: "A checkout spans several services: reserve inventory, charge payment, create a shipment. There is no single transaction across them. A"
                    - strong [ref=e1219]: saga
                    - text: runs the steps in order and, if one fails, runs compensating actions to undo the earlier ones.
                  - paragraph [ref=e1220]: Choose where the saga fails and step through it. The steps commit in order; when one fails, each already-committed step is undone in reverse by its compensation.
