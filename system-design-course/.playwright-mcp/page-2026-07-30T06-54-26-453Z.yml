                      - strong [ref=e1705]: Graph databases
                      - text: store nodes and edges. Neo4j models relationships as first-class citizens. Use them for social networks and recommendation engines.
                  - paragraph [ref=e1706]:
                    - text: NoSQL databases sacrifice ACID guarantees for availability and partition tolerance. Most offer
                    - strong [ref=e1707]: eventual consistency
                    - text: ": writes propagate to all nodes within seconds. Strong consistency is optional but reduces availability."
                  - paragraph [ref=e1708]:
                    - text: For in-depth exploration of NoSQL databases and distributed database concepts, see
                    - link "NoSQL Database Fundamentals" [ref=e1709] [cursor=pointer]:
