                  - paragraph [ref=e2131]: "System design problems often arrive as vague statements: \"Design Twitter\" or \"Design Uber.\" The first challenge is decomposing these into concrete technical requirements. Instead of guessing what the interviewer wants, use keywords in the problem statement as anchors."
