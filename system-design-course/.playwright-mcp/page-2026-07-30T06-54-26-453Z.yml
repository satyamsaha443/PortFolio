                  - 'heading "Step 0: Verbs → Use Cases" [level=3] [ref=e2133]'
                  - paragraph [ref=e2134]: Verbs reveal operations. "Users can post tweets" contains the verb "post." "Users view their feed" contains "view." Extract all verbs to identify use cases.
                  - paragraph [ref=e2135]: "Common verbs map to CRUD operations: create, read, update, delete, search, notify, process. Each verb becomes a functional requirement."
                  - paragraph [ref=e2136]: Beyond identifying operations, define what "correct" means for each. Does "post tweet" require deduplication? Should followers see tweets immediately or eventually? Must tweets persist forever? These questions transform vague verbs into precise contracts.
                  - 'heading "Step 1: Nouns → Entities and Ownership" [level=3] [ref=e2137]'
                  - paragraph [ref=e2138]: "Nouns reveal data models. \"Users post tweets\" contains two nouns: \"users\" and \"tweets.\" \"Users follow other users\" reveals a relationship entity."
                  - paragraph [ref=e2139]: List all entities and their relationships. For each entity, identify the source of truth. Who owns user profile data? Where do tweets live? Which service controls the follow relationship?
