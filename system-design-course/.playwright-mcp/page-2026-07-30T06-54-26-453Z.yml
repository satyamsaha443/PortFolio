                  - heading "Core Design Challenges" [level=2] [ref=e326]
                  - paragraph [ref=e327]: Now that we understand how to solve system design problems, examine the most common challenges. Like solutions assembled from reusable building blocks, these challenges have repeatable patterns.
                  - 'heading "Challenge 1: Too Many Concurrent Users" [level=3] [ref=e328]'
                  - paragraph [ref=e329]: Large user bases introduce many problems. The most common and intuitive is that single machines or databases have RPS/QPS limits. In all single-server demo apps from web dev tutorials, server performance degenerates fast once limits are exceeded.
                  - paragraph [ref=e330]: The solution is repetition. Repeat the same assets and assign users randomly to each replication. When replicated assets are server logic, it's called load balancing. When replicated assets are data, it's called database replicas.
