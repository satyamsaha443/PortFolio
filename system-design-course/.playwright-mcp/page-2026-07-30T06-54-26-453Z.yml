                  - paragraph [ref=e2208]: Clear ownership prevents conflicts. If two services try updating the same tweet, which write wins? Establishing the Tweet Service as the single source of truth eliminates ambiguity.
                  - 'heading "Step 2: Identify Constraints from Adjectives" [level=3] [ref=e2209]'
                  - paragraph [ref=e2210]: Apply the third step. Extract adjectives from the problem description to identify non-functional requirements and their architectural implications.
                  - paragraph [ref=e2211]: "The problem states Twitter should have \"low latency\" responses, \"high availability,\" support \"scalable\" growth, and ensure \"durable\" storage. Extract the adjectives: low latency, highly available, scalable, durable."
                  - paragraph [ref=e2212]: "Map each adjective to technical solutions:"
                  - paragraph [ref=e2213]:
                    - strong [ref=e2214]: Low latency
                    - text: ": Users expect feeds to load in under 500ms. This forces caching strategies. Precompute feeds and store in Redis. Read from cache instead of querying the database for every request."
                  - paragraph [ref=e2215]:
                    - strong [ref=e2216]: Highly available
                    - text: ": The system must handle partial failures. If the Tweet Service crashes after receiving a post request, the tweet should not be lost. This forces message queues. Buffer write requests in Kafka. Even if services go down, messages persist and process when services recover."
                  - paragraph [ref=e2217]:
                    - strong [ref=e2218]: Scalable
                    - text: ": Twitter has 400 million monthly active users. A single server cannot handle this load. This forces horizontal scaling with load balancers distributing requests across multiple service instances. It also forces database partitioning to distribute data across shards."
                  - paragraph [ref=e2219]:
                    - strong [ref=e2220]: Durable
                    - text: ": Tweets must never be lost. This forces distributed databases with replication. Store data across multiple nodes. If one node fails, replicas ensure data remains accessible."
                  - paragraph [ref=e2221]: Each adjective added components to the architecture. Without "low latency," we wouldn't need cache. Without "highly available," we wouldn't need message queues. The constraints drive the design.
