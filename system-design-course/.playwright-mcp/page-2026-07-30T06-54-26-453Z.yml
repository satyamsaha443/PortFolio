                      - strong [ref=e2302]: NEW
                      - text: badge marks the component added at that step; everything else was justified in an earlier step.
                  - heading "Basic Data Flow" [level=3] [ref=e2303]
                  - paragraph [ref=e2304]: Take API endpoints and map data flow with services. Show methodical, structured thinking. Start simple without complicated parts. This way, if you make mistakes, interviewers can correct them early.
                  - paragraph [ref=e2305]:
                    - text: For microservices approaches, see
