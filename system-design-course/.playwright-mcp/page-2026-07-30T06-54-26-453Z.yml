                  - heading "Vertical Scaling" [level=3] [ref=e626]
                  - paragraph [ref=e627]: Vertical scaling represents the brute force approach to scaling. Scale up by using more powerful machines. Thanks to cloud computing advancements, this approach has become much more feasible. In the past, organizations waited for new machines to be built and shipped. Today they spin up new instances in seconds.
