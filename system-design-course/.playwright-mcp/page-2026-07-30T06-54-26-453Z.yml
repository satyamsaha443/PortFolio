                  - heading "Common Implementations" [level=4] [ref=e1832]
                  - paragraph [ref=e1833]: Redis is an in-memory cache delivering sub-millisecond latency. It supports data structures like strings, lists, sets, and sorted sets. Use it for session storage, leaderboards, and general-purpose caching.
                  - paragraph [ref=e1834]: Memcached is a simpler in-memory cache optimized for basic key-value storage. It's faster for simple operations but lacks Redis's data structures. Use it for straightforward caching needs prioritizing simplicity.
                  - paragraph [ref=e1835]: CDNs like Cloudflare act as distributed caches for static assets. They cache images, CSS, and JavaScript files at edge locations worldwide. Use them for content delivery optimization.
                  - heading "CDN (Content Delivery Network)" [level=3] [ref=e1836]
                  - heading "The Problem" [level=4] [ref=e1837]
                  - paragraph [ref=e1838]: A news website hosts videos in a New York data center. A user in Tokyo clicks play. The video request travels 11,000 kilometers to New York and back. Network latency alone is 200ms. The video stutters.
                  - paragraph [ref=e1839]: Millions of users watch the same viral video. The origin server in New York handles 10,000 requests per second. Bandwidth costs spike. The server struggles. Some requests time out.
                  - paragraph [ref=e1840]: CDNs solve this by caching static content on edge servers distributed globally. Tokyo users fetch videos from a Tokyo edge server. Latency drops to 5ms. The origin server handles far fewer requests because edge servers absorb most traffic.
